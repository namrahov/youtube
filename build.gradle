plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.3'
}

group = 'az.youtube'
version = '0.0.1-SNAPSHOT'
description = 'YouTube system design learning project'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(26)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation platform('org.springframework.boot:spring-boot-dependencies:4.1.3')
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-liquibase'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-kafka'
    // View count deduplication and the set of counters waiting to be copied to the search index.
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'
    // /actuator/prometheus: upload, processing, outbox and playback metrics (PDF section 9).
    runtimeOnly 'io.micrometer:micrometer-registry-prometheus'
    // S3 API: MinIO locally, AWS S3 in production. Multipart upload and presigned part URLs.
    implementation platform('software.amazon.awssdk:bom:2.42.1')
    implementation 'software.amazon.awssdk:s3'
    runtimeOnly 'org.postgresql:postgresql'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    // Integration tests (*IT, run with ./gradlew integrationTest) start real PostgreSQL, Kafka and MinIO in Docker.
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    testImplementation 'org.testcontainers:testcontainers-junit-jupiter'
    testImplementation 'org.testcontainers:testcontainers-postgresql'
    testImplementation 'org.testcontainers:testcontainers-kafka'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs.add('-parameters')
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
}

tasks.named('test') {
    exclude '**/*IT.class'
}

tasks.register('integrationTest', Test) {
    description = 'Runs integration tests (*IT) against PostgreSQL, Kafka and MinIO containers (needs Docker).'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    include '**/*IT.class'
    shouldRunAfter tasks.named('test')
}
