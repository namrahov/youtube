# A one-node "CDN edge" in front of the MinIO origin (PDF section 6). Players get http://localhost:8093/streams/...
#   hit  → served from local disk, the origin is not asked
#   miss → fetched from the origin once, stored, then served
# Only streams/ is reachable through it: originals/ is never exposed.
# Cache lifetime comes from the origin's Cache-Control: segments and rendition playlists are immutable (1 year),
# the master playlist 10 s (it changes while renditions finish).

proxy_cache_path /var/cache/nginx/cdn levels=1:2 keys_zone=streams:10m max_size=2g inactive=7d use_temp_path=off;

server {
    listen 80;

    location /streams/ {
        limit_except GET {
            deny all;
        }

        proxy_pass http://minio:9000/youtube-videos/streams/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_cache streams;
        # The path is the whole identity of a file; query strings must not split or bust the cache.
        proxy_cache_key $uri;
        # Only when the origin sends no Cache-Control: a missing object is remembered briefly, so a hot wrong URL
        # does not hammer the origin.
        proxy_cache_valid 403 404 10s;
        # Request collapsing: 100 parallel misses for one segment of a viral video make one origin request.
        proxy_cache_lock on;
        proxy_cache_lock_timeout 10s;
        # Origin down: keep serving what we have.
        proxy_cache_use_stale error timeout http_500 http_502 http_503 http_504;
        proxy_ignore_headers Set-Cookie;

        proxy_hide_header x-amz-request-id;
        proxy_hide_header x-amz-id-2;
        proxy_hide_header x-minio-deployment-id;
        proxy_hide_header Strict-Transport-Security;
        # MinIO echoes the request's Origin; a cached copy would then carry the first viewer's origin to everyone.
        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Access-Control-Allow-Credentials;
        proxy_hide_header Access-Control-Expose-Headers;
        proxy_hide_header Vary;

        add_header X-Cache-Status $upstream_cache_status always;
        # Web players (hls.js) fetch playlists and segments from another origin than the page.
        add_header Access-Control-Allow-Origin * always;
    }
}
