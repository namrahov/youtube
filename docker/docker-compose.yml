# Local infrastructure for the youtube app: Kafka, MinIO (S3 API), a CDN edge, Redis and Elasticsearch.
# PostgreSQL runs on the host (port 5433).
# Host ports differ from twitter (Kafka 9092, Redis 6380) and whatsapp (Kafka 9094) so all stacks can run at once.
# Usage: docker compose -f docker/docker-compose.yml up -d
name: youtube

services:
  kafka:
    image: apache/kafka:3.9.1
    container_name: youtube-kafka
    ports:
      - "9095:9092"
    environment:
      # Single node in KRaft mode: the same process is broker and controller, no ZooKeeper.
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9095
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    volumes:
      - kafka-data:/var/lib/kafka/data
    restart: unless-stopped

  minio:
    # S3-compatible object storage: originals, renditions and manifests. The app creates its bucket on startup.
    # MinIO no longer publishes images on Docker Hub; this one is built locally (MINIO_IMAGE to use another).
    image: ${MINIO_IMAGE:-ecis-local/minio:RELEASE.2025-09-07T16-13-09Z}
    container_name: youtube-minio
    command: ["server", "/data", "--console-address", ":9001"]
    ports:
      - "9010:9000"   # S3 API: presigned upload URLs point here
      - "9011:9001"   # web console
    environment:
      # Local development only; elsewhere real credentials come from the environment.
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-minioadmin}
    volumes:
      - minio-data:/data
    restart: unless-stopped

  cdn:
    # CDN edge (nginx cache) in front of MinIO: players stream from http://localhost:8093/streams/...
    image: nginx:1.28-alpine
    container_name: youtube-cdn
    depends_on:
      - minio
    ports:
      - "8093:80"
    volumes:
      - ./cdn/default.conf:/etc/nginx/conf.d/default.conf:ro
      - cdn-cache:/var/cache/nginx/cdn
    restart: unless-stopped

  redis:
    # View deduplication keys and the queue of counters to copy into the search index.
    image: redis:7.4.2
    container_name: youtube-redis
    ports:
      - "6381:6379"
    restart: unless-stopped

  elasticsearch:
    # Search index (OpenSearch exposes the same REST API). Single node, no security: local development only.
    image: ${ELASTICSEARCH_IMAGE:-docker.elastic.co/elasticsearch/elasticsearch:9.0.0}
    container_name: youtube-elasticsearch
    ports:
      - "9201:9200"
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    volumes:
      - es-data:/usr/share/elasticsearch/data
    restart: unless-stopped

volumes:
  kafka-data:
  minio-data:
  cdn-cache:
  es-data:
