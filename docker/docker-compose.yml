# Local infrastructure for the youtube app: Kafka + MinIO (S3 API). PostgreSQL runs on the host (port 5433).
# Host ports differ from twitter (Kafka 9092) and whatsapp (Kafka 9094) so all stacks can run at once.
# Usage: docker compose -f docker/docker-compose.yml up -d
name: youtube

services:
  kafka:
    image: apache/kafka:3.9.1
    container_name: youtube-kafka
    ports:
      - "9095:9092"
    environment:
      # Single node in KRaft mode: the same process is broker and controller, no ZooKeeper.
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9095
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    volumes:
      - kafka-data:/var/lib/kafka/data
    restart: unless-stopped

  minio:
    # S3-compatible object storage: originals, renditions and manifests. The app creates its bucket on startup.
    # MinIO no longer publishes images on Docker Hub; this one is built locally (MINIO_IMAGE to use another).
    image: ${MINIO_IMAGE:-ecis-local/minio:RELEASE.2025-09-07T16-13-09Z}
    container_name: youtube-minio
    command: ["server", "/data", "--console-address", ":9001"]
    ports:
      - "9010:9000"   # S3 API: presigned upload URLs point here
      - "9011:9001"   # web console
    environment:
      # Local development only; elsewhere real credentials come from the environment.
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-minioadmin}
    volumes:
      - minio-data:/data
    restart: unless-stopped

volumes:
  kafka-data:
  minio-data:
