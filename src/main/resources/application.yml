spring:
  application:
    name: youtube
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/youtube}
    username: ${DB_USERNAME:postgres}
    # No default on purpose: set DB_PASSWORD in the IntelliJ run configuration or the terminal.
    password: ${DB_PASSWORD}
    hikari:
      # 10 transcoding listener threads (4+3+2+1) can each hold a connection while the manifest is written,
      # plus web requests, the outbox publisher and the expiry sweep.
      maximum-pool-size: 20
      connection-timeout: 3000
  task:
    scheduling:
      pool:
        # The outbox publisher must not wait behind a slow expiry sweep.
        size: 2
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yml
  mvc:
    problemdetails:
      enabled: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6381}
      timeout: 2s
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9095}
    producer:
      # Wait for all in-sync replicas; idempotence stops broker-side duplicates on producer retries.
      acks: all
      properties:
        enable.idempotence: true
        # send() blocks up to this long when the broker is unreachable (default 60 s).
        max.block.ms: 5000
    consumer:
      # A new consumer group starts from the beginning, so no job published before it existed is skipped.
      auto-offset-reset: earliest

server:
  port: ${SERVER_PORT:8082}

youtube:
  storage:
    endpoint: ${S3_ENDPOINT:http://localhost:9010}
    region: ${S3_REGION:us-east-1}
    bucket: ${S3_BUCKET:youtube-videos}
    access-key: ${S3_ACCESS_KEY:minioadmin}
    secret-key: ${S3_SECRET_KEY:minioadmin}
    # MinIO needs path-style URLs (http://host/bucket/key); AWS S3 works with either.
    path-style-access: ${S3_PATH_STYLE_ACCESS:true}
    # Local convenience: create the bucket on startup. In production the bucket is provisioned by infrastructure.
    create-bucket: ${S3_CREATE_BUCKET:true}
    # Local convenience: anyone may GET under streams/ (playlists and segments; originals/ stays private), so a
    # player can stream straight from MinIO. In production the bucket is private and only the CDN reads it.
    public-streams: ${S3_PUBLIC_STREAMS:true}
  playback:
    # Base of the playback URLs the API returns: the CDN. Locally the nginx edge from docker-compose (port 8093),
    # which serves streams/ from MinIO; in production the CDN domain.
    base-url: ${PLAYBACK_BASE_URL:http://localhost:8093}
  search:
    # Elasticsearch locally; OpenSearch takes the same requests.
    url: ${SEARCH_URL:http://localhost:9201}
    # The alias the app reads and writes. A reindex builds a new index and moves the alias, with no downtime.
    index: ${SEARCH_INDEX:videos}
    timeout: ${SEARCH_TIMEOUT:3s}
    # View counts change constantly; they are copied into the index in bulk at this interval, not per view.
    stats-sync-interval-ms: ${SEARCH_STATS_SYNC_INTERVAL_MS:30000}
  views:
    # A view counts after this much watching (or the whole video, if it is shorter).
    min-watch: ${VIEWS_MIN_WATCH:30s}
    # The same user is counted once per video within this window: refreshing the page does not add views.
    repeat-viewer-window: ${VIEWS_REPEAT_VIEWER_WINDOW:24h}
    # How long a view's eventId is remembered, so a retried request is not counted again.
    event-dedup-ttl: ${VIEWS_EVENT_DEDUP_TTL:24h}
    # The aggregator waits up to this long for a batch to fill, then adds each video's views in one UPDATE.
    batch-wait-ms: ${VIEWS_BATCH_WAIT_MS:2000}
    max-batch: ${VIEWS_MAX_BATCH:5000}
  lifecycle:
    # Originals of videos that failed processing (not a readable video, every rendition failed) are kept this long
    # for support and debugging, then deleted.
    failed-original-retention: ${LIFECYCLE_FAILED_ORIGINAL_RETENTION:7d}
    purge-sweep-interval-ms: ${LIFECYCLE_PURGE_SWEEP_INTERVAL_MS:3600000}
  upload:
    # 2 GB / 64 MB = 32 parts. A failed part is retried alone; S3 allows at most 10 000 parts per upload.
    part-size: ${UPLOAD_PART_SIZE:64MB}
    max-size: ${UPLOAD_MAX_SIZE:256GB}
    # How long one presigned part URL stays valid. A client that resumes later asks for fresh URLs.
    part-url-ttl: ${UPLOAD_PART_URL_TTL:1h}
    # An upload still UPLOADING after this is abandoned: its multipart upload is aborted (orphan parts cost money).
    upload-ttl: ${UPLOAD_TTL:24h}
    expiry-sweep-interval-ms: ${UPLOAD_EXPIRY_SWEEP_INTERVAL_MS:600000}
  transcoding:
    # ffmpeg: real HLS renditions (needs ffmpeg and ffprobe). simulated: waits and writes empty playlists.
    engine: ${TRANSCODING_ENGINE:ffmpeg}
    # The bitrate ladder. Renditions larger than the source are SKIPPED (no upscaling); the lowest is always made.
    # FULLY_PROCESSED means every rendition that was not skipped COMPLETED.
    resolutions: ${TRANSCODING_RESOLUTIONS:P360,P720,P1080,P2160}
    # Retries of a failed job before its variant is marked FAILED (playback goes on with the other variants).
    max-retries: ${TRANSCODING_MAX_RETRIES:3}
    retry-interval: ${TRANSCODING_RETRY_INTERVAL:5s}
    # A separate worker pool per resolution: 4K jobs are heavy and few, 360p jobs light and many.
    # Each listener thread runs one job at a time; threads above the topic's partition count stay idle.
    concurrency:
      p360: ${TRANSCODING_CONCURRENCY_360P:4}
      p720: ${TRANSCODING_CONCURRENCY_720P:3}
      p1080: ${TRANSCODING_CONCURRENCY_1080P:2}
      p2160: ${TRANSCODING_CONCURRENCY_2160P:1}
    # An encode running longer is killed and retried. Plus transfer-allowance (download + upload), this is the
    # pool's Kafka max.poll.interval.ms, so a running job is never handed to a second worker.
    job-timeout:
      P360: ${TRANSCODING_TIMEOUT_360P:30m}
      P720: ${TRANSCODING_TIMEOUT_720P:45m}
      P1080: ${TRANSCODING_TIMEOUT_1080P:1h}
      P2160: ${TRANSCODING_TIMEOUT_2160P:3h}
    transfer-allowance: ${TRANSCODING_TRANSFER_ALLOWANCE:15m}
    ffmpeg:
      ffmpeg-path: ${FFMPEG_PATH:ffmpeg}
      ffprobe-path: ${FFPROBE_PATH:ffprobe}
      # x264 speed/size trade-off. veryfast keeps local runs short; production would use slow or medium.
      preset: ${FFMPEG_PRESET:veryfast}
      # 4 s segments, a keyframe every 2 s in every rendition: segment boundaries line up across renditions,
      # so the player can switch quality at any segment.
      segment-duration: ${HLS_SEGMENT_DURATION:4s}
      keyframe-interval: ${HLS_KEYFRAME_INTERVAL:2s}
      probe-timeout: ${FFPROBE_TIMEOUT:1m}
      work-dir: ${TRANSCODING_WORK_DIR:${java.io.tmpdir}/youtube-transcode}
    # Simulated engine only: how long a job pretends to encode.
    simulated-duration:
      P360: ${TRANSCODING_SIMULATED_360P:2s}
      P720: ${TRANSCODING_SIMULATED_720P:4s}
      P1080: ${TRANSCODING_SIMULATED_1080P:6s}
      P2160: ${TRANSCODING_SIMULATED_2160P:15s}

management:
  endpoints:
    web:
      exposure:
        # prometheus: scraped by Prometheus; metrics: the same numbers, browsable as JSON.
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: never
  metrics:
    tags:
      application: youtube
    distribution:
      # Playback startup (PDF target: p95 < 2 s) and encode time: histogram buckets let Prometheus compute
      # percentiles over many instances (client-side percentiles cannot be added up).
      percentiles-histogram:
        youtube.playback.startup: true
        youtube.transcode.duration: true
        youtube.video.time.to.playable: true
      slo:
        youtube.playback.startup: 1s,2s,4s
