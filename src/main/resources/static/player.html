<!doctype html>
<!--
  Local demo client: search, adaptive bitrate playback (PDF section 5), view counting and playback metrics.
  The backend returns the master playlist URL (through the CDN); hls.js measures segment download speed and buffer
  health and picks the rendition of each next segment. Throttle the network in DevTools to watch it step down.
  The player also reports what only it can measure: time to first frame and stalls (PDF section 9).
  Open http://localhost:8082/player.html
-->
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>HLS Player</title>
    <style>
        :root { --bg: #fff; --fg: #1a1a1a; --muted: #666; --line: #ddd; --accent: #c00; }
        @media (prefers-color-scheme: dark) { :root { --bg: #111; --fg: #eee; --muted: #999; --line: #333; --accent: #f55; } }
        body { margin: 0; padding: 16px; background: var(--bg); color: var(--fg); font: 14px/1.5 system-ui, sans-serif; }
        main { max-width: 960px; margin: 0 auto; }
        form, .levels { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 12px; }
        input { padding: 6px; }
        input[type=number] { width: 110px; }
        input[type=search] { flex: 1; min-width: 200px; }
        button { padding: 6px 12px; cursor: pointer; }
        button.active { border-color: var(--accent); color: var(--accent); }
        video { width: 100%; background: #000; aspect-ratio: 16 / 9; }
        table { border-collapse: collapse; margin: 12px 0; }
        td, th { border: 1px solid var(--line); padding: 4px 10px; text-align: left; }
        #results { list-style: none; padding: 0; margin: 0 0 12px; }
        #results li { padding: 6px 0; border-bottom: 1px solid var(--line); cursor: pointer; }
        #results small, #stats, #log { color: var(--muted); }
        #stats { font-family: ui-monospace, monospace; }
        #log { font-family: ui-monospace, monospace; max-height: 200px; overflow: auto; white-space: pre-wrap; }
    </style>
</head>
<body>
<main>
    <h1>YouTube demo player</h1>
    <form id="searchForm">
        <input id="query" type="search" placeholder="Search videos (typos and prefixes work)">
        <button type="submit">Search</button>
    </form>
    <ul id="results"></ul>
    <form id="form">
        <label>Video id <input id="videoId" type="number" min="1" required></label>
        <label>X-User-Id <input id="userId" type="number" min="1" value="1" required></label>
        <button type="submit">Load</button>
    </form>
    <video id="video" controls muted playsinline></video>
    <div class="levels" id="levels"></div>
    <div id="stats"></div>
    <p id="info"></p>
    <table id="variants" hidden><thead><tr><th>Rendition</th><th>Status</th><th>Size</th></tr></thead><tbody></tbody></table>
    <div id="log"></div>
</main>
<script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.20/dist/hls.min.js"></script>
<script>
    const $ = id => document.getElementById(id);
    const video = $('video');
    const MIN_WATCH_SECONDS = 30;
    let hls;
    let session = null;

    function log(message) {
        $('log').textContent = new Date().toLocaleTimeString() + '  ' + message + '\n' + $('log').textContent;
    }

    const userHeaders = () => ({'X-User-Id': $('userId').value, 'Content-Type': 'application/json'});

    // --- Search -------------------------------------------------------------------------------------------------
    $('searchForm').addEventListener('submit', async event => {
        event.preventDefault();
        const response = await fetch('/api/search?q=' + encodeURIComponent($('query').value));
        if (!response.ok) {
            log('Search failed: ' + response.status);
            return;
        }
        const result = await response.json();
        $('results').innerHTML = '';
        for (const hit of result.results) {
            const item = document.createElement('li');
            item.innerHTML = '<strong></strong> <small></small>';
            item.querySelector('strong').textContent = hit.title;
            item.querySelector('small').textContent = '#' + hit.id + ' · ' + hit.viewCount + ' views';
            item.onclick = () => { $('videoId').value = hit.id; $('form').requestSubmit(); };
            $('results').appendChild(item);
        }
        log('Search "' + $('query').value + '": ' + result.total + ' result(s)');
    });

    // --- Load and play ------------------------------------------------------------------------------------------
    $('form').addEventListener('submit', async event => {
        event.preventDefault();
        endSession();
        const response = await fetch('/api/videos/' + $('videoId').value, {headers: userHeaders()});
        if (!response.ok) {
            log('GET /api/videos failed: ' + response.status);
            return;
        }
        const info = await response.json();
        $('info').textContent = info.title + ' · ' + info.viewCount + ' views · ' + info.status;
        $('variants').querySelector('tbody').innerHTML = info.variants.map(v => '<tr><td>' + v.resolution + '</td><td>'
            + v.status + '</td><td>' + (v.width ? v.width + '×' + v.height : '') + '</td></tr>').join('');
        $('variants').hidden = false;
        if (!info.playbackUrl) {
            log('Not playable yet');
            return;
        }
        startSession(info.id);
        play(info.playbackUrl);
    });

    function play(url) {
        if (hls) {
            hls.destroy();
        }
        if (!window.Hls || !Hls.isSupported()) {
            video.src = url; // Safari: native HLS with its own ABR
            video.play();
            return;
        }
        // Start low: the first segment arrives fast (startup time), then ABR steps up as bandwidth allows.
        hls = new Hls({startLevel: 0});
        hls.loadSource(url);
        hls.attachMedia(video);
        hls.on(Hls.Events.MANIFEST_PARSED, (_, data) => {
            log('Master playlist: ' + data.levels.map(l => l.height + 'p @ ' + Math.round(l.bitrate / 1000) + ' kbit/s').join(', '));
            renderLevelButtons();
            video.play();
        });
        hls.on(Hls.Events.LEVEL_SWITCHED, (_, data) => {
            const level = hls.levels[data.level];
            log('Switched to ' + level.height + 'p (' + Math.round(level.bitrate / 1000) + ' kbit/s)');
            renderLevelButtons();
        });
        hls.on(Hls.Events.ERROR, (_, data) => log('Error: ' + data.details + (data.fatal ? ' (fatal)' : '')));
    }

    function renderLevelButtons() {
        const auto = hls.autoLevelEnabled;
        const buttons = [['Auto', -1, auto]].concat(hls.levels.map((l, i) => [l.height + 'p', i, !auto && hls.currentLevel === i]));
        $('levels').innerHTML = '';
        for (const [label, index, active] of buttons) {
            const button = document.createElement('button');
            button.textContent = label;
            button.className = active ? 'active' : '';
            button.onclick = () => { hls.currentLevel = index; renderLevelButtons(); };
            $('levels').appendChild(button);
        }
    }

    // --- Session: startup time, stalls, view counting -----------------------------------------------------------
    function startSession(videoId) {
        session = {videoId, loadedAt: performance.now(), started: false, watchedMs: 0, stalledMs: 0, stalls: 0,
                   stallSince: null, lastTick: null, viewEventId: crypto.randomUUID(), viewSent: false};
    }

    video.addEventListener('playing', () => {
        if (!session) return;
        const now = performance.now();
        if (!session.started) {
            session.started = true;
            report({videoId: session.videoId, startupMs: Math.round(now - session.loadedAt)});
            log('First frame after ' + Math.round(now - session.loadedAt) + ' ms');
        } else if (session.stallSince !== null) {
            session.stalledMs += now - session.stallSince;
        }
        session.stallSince = null;
        session.lastTick = now;
    });

    // "waiting" after playback started = the buffer ran dry: a rebuffering stall.
    video.addEventListener('waiting', () => {
        if (session && session.started && session.stallSince === null) {
            session.stalls++;
            session.stallSince = performance.now();
            log('Stalled (rebuffering)');
        }
    });

    video.addEventListener('timeupdate', () => {
        if (!session || video.paused || session.stallSince !== null) return;
        const now = performance.now();
        if (session.lastTick !== null) session.watchedMs += Math.min(now - session.lastTick, 1000);
        session.lastTick = now;
        const required = Math.min(MIN_WATCH_SECONDS, Math.floor(video.duration || MIN_WATCH_SECONDS));
        if (!session.viewSent && session.watchedMs / 1000 >= required) {
            session.viewSent = true;
            countView(session.videoId, session.viewEventId, Math.floor(session.watchedMs / 1000));
        }
    });

    video.addEventListener('pause', () => { if (session) session.lastTick = null; });

    /** The same eventId on a retry: the server counts it once. */
    async function countView(videoId, eventId, watchedSeconds, attempt = 1) {
        const response = await fetch('/api/videos/' + videoId + '/views', {method: 'POST', headers: userHeaders(),
            body: JSON.stringify({eventId, watchedSeconds})});
        if (response.status === 503 && attempt < 3) {
            setTimeout(() => countView(videoId, eventId, watchedSeconds, attempt + 1), 1000 * attempt);
            return;
        }
        log('View reported: ' + response.status);
    }

    function report(body) {
        navigator.sendBeacon('/api/playback/reports', new Blob([JSON.stringify(body)], {type: 'application/json'}));
    }

    function endSession() {
        if (session && session.started) {
            report({videoId: session.videoId, watchedMs: Math.round(session.watchedMs),
                    stalledMs: Math.round(session.stalledMs), stalls: session.stalls});
        }
        session = null;
    }

    window.addEventListener('pagehide', endSession);

    setInterval(() => {
        if (!hls || hls.currentLevel < 0 || !hls.levels[hls.currentLevel]) {
            return;
        }
        const level = hls.levels[hls.currentLevel];
        let buffered = 0;
        for (let i = 0; i < video.buffered.length; i++) {
            if (video.buffered.start(i) <= video.currentTime && video.currentTime <= video.buffered.end(i)) {
                buffered = video.buffered.end(i) - video.currentTime;
            }
        }
        $('stats').textContent = 'playing ' + level.width + '×' + level.height
            + ' | estimated bandwidth ' + Math.round(hls.bandwidthEstimate / 1000) + ' kbit/s'
            + ' | buffer ahead ' + buffered.toFixed(1) + ' s'
            + (session ? ' | watched ' + Math.round(session.watchedMs / 1000) + ' s, stalls ' + session.stalls : '');
    }, 500);
</script>
</body>
</html>
